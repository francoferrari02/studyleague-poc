server {
  listen 80;
  root /usr/share/nginx/html;

  # /api/... → API (se recorta el prefijo /api)
  location /api/ {
    # Docker puede reasignar la IP al reiniciar la API durante demo-reset.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_backend api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_backend;
    proxy_set_header Host $host;
  }

  # Rutas de React Router
  location / {
    try_files $uri /index.html;
  }
}
